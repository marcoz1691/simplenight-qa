name: Playwright Tests

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

  test:
    needs: typecheck
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ENV: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check staging reachability from CI
        id: staging
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://wl.stg.simplenight.com/home/hotels || echo "000")
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "Staging HTTP status from runner: $code"

      - name: Run tests
        if: steps.staging.outputs.http_code == '200'
        run: npm run test:hotels -- --project=chromium --workers=1

      - name: Skip E2E (staging not reachable from CI)
        if: steps.staging.outputs.http_code != '200'
        run: |
          echo "Skipping E2E — staging returned HTTP ${{ steps.staging.outputs.http_code }} from GitHub Actions."
          echo "Run locally: npm run test:hotels -- --project=chromium"

      - name: Upload HTML report
        if: always() && steps.staging.outputs.http_code == '200'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
